<p-toast></p-toast>

<div class="grid">
	<div class="col-12">
		<div class="card">
			<p-dataView #dv [value]="productsInCart" [paginator]="true" [rows]="9" filterBy="productName" [sortField]="sortField" [sortOrder]="sortOrder" layout="list">
				<ng-template pTemplate="header">
					<div class="flex flex-column md:flex-row md:justify-content-between gap-2">
            <p-dropdown [options]="sortOptions" placeholder="Sortiraj po ceni" (onChange)="onSortChange($event)"></p-dropdown>
						<span class="text-2xl">Pregled porudžbine</span>
						<span class="p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input type="search" pInputText placeholder="Pretraži po nazivu" (input)="onFilter(dv, $event)">
                        </span>	
					</div>
				</ng-template>

				<ng-template let-item pTemplate="listItem">
  <div class="col-12">
    <div class="p-3 w-full border-bottom-1 surface-border">

      <!-- GRID ROW -->
      <div class="grid align-items-center">

        <!-- IMAGE -->
        <div class="col-12 md:col-2 flex justify-content-center md:justify-content-start">
          <img
            [src]="productImageService.getStoredImageUrl(item.storedFileName)"
            [alt]="item.productName"
            class="w-9 md:w-10rem shadow-2"
          />
        </div>

        <!-- NAME + DESCRIPTION -->
        <div class="col-12 md:col-4">
          <div class="font-bold text-2xl mb-2">{{ item.productName }}</div>
          <div class="mb-2">{{ item.productDescription }}</div>
          <div class="text-sm text-600">Veličina: {{ item.size | enumFormat }}</div>
        </div>

        <!-- QUANTITY (FIXED COLUMN) -->
        <div class="col-12 md:col-2 flex flex-column align-items-center">
          <div class="text-sm text-600 mb-2">Količina</div>
          <div class="flex align-items-center gap-2">
            <button
              pButton
              pRipple
              icon="pi pi-minus"
              class="p-button-rounded p-button-sm p-button-text"
              (click)="decreaseQuantity(item)"
            ></button>

            <span class="font-bold text-lg">{{ item.quantity }}</span>

            <button
              pButton
              pRipple
              icon="pi pi-plus"
              class="p-button-rounded p-button-sm p-button-text"
              (click)="increaseQuantity(item)"
            ></button>
          </div>
        </div>

        <!-- PRICE (FIXED COLUMN) -->
        <div class="col-12 md:col-3 md:text-right">
          <div class="text-2xl font-semibold mb-2">{{ item.price }} RSD</div>
          <div class="text-lg">Ukupno: {{ item.price * item.quantity }} RSD</div>
        </div>

        <!-- DELETE (FIXED COLUMN) -->
        <div class="col-12 md:col-1 flex justify-content-center md:justify-content-end mt-3 md:mt-0">
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-danger p-button-rounded"
            (click)="removeProductFromCart(item)"
          ></button>
        </div>

      </div>
      <!-- /GRID ROW -->

    </div>
  </div>
</ng-template>
			</p-dataView>
			<div class="flex justify-content-between p-3 border-top">
				<button pButton pRipple type="button" label="Nazad na poručivanje" class="p-button-raised p-button-outlined p-button-warning" (click)="onBackToMenu()"></button>
				<button pButton pRipple type="button" label="Završi porudžbinu" class="p-button-raised p-button-warning" (click)="createOrder()" [disabled]="productsInCart.length == 0"></button>
				<span class="text-2xl">Ukupno: {{ totalPrice }} RSD</span>
			</div>
		</div>
	</div>

<!-- ORDER CONFIRMATION dialog -->
<p-dialog [(visible)]="orderConfirmationDialog" header="Porudžbina primljena" [modal]="true" [closable]="false" [style]="{width:'450px'}">
  <div class="flex flex-column align-items-center text-center gap-3 p-3">
    <i class="pi pi-check-circle text-green-500" style="font-size: 3rem"></i>
    <span class="text-xl">Vaš broj porudžbine je <b>#{{ confirmedOrderNumber }}</b></span>
  </div>
  <ng-template pTemplate="footer">
    <button pButton pRipple icon="pi pi-check" class="p-button-text" label="OK" (click)="onOrderConfirmationOk()"></button>
  </ng-template>
</p-dialog>

<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p-toast></p-toast>

      <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
          <div class="my-2">
            <button pButton pRipple label="New" icon="pi pi-plus"
              class="p-button-success mr-2" (click)="openNew()"></button>
          </div>
        </ng-template>
      </p-toolbar>

      <p-table
        #dt
        [value]="ingredients"
        responsiveLayout="scroll"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[10,20,30]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowHover]="true"
        dataKey="id"
        [globalFilterFields]="['name']"
      >
        <ng-template pTemplate="caption">
          <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
            <h5 class="m-0">Manage Ingredients</h5>
            <span class="block mt-2 md:mt-0 p-input-icon-left">
              <i class="pi pi-search"></i>
              <input pInputText type="text" (input)="onGlobalFilter(dt, $event)"
                placeholder="Search..." class="w-full sm:w-auto" />
            </span>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name">
              Name <p-sortIcon field="name"></p-sortIcon>
            </th>

            <th pSortableColumn="quantity">
              Quantity <p-sortIcon field="quantity"></p-sortIcon>
            </th>

            <th>Unit</th>

            <th></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-ingredient>
          <tr>
            <td style="min-width: 12rem;">
              <span class="p-column-title">Name</span>
              {{ ingredient.name }}
            </td>

            <td style="min-width: 10rem;">
              <span class="p-column-title">Quantity</span>
              {{ ingredient.quantity }}
            </td>

            <td style="min-width: 8rem;">
              <span class="p-column-title">Unit</span>
              {{ ingredient.unit }}
            </td>

            <td>
              <div class="flex">
                <button pButton pRipple icon="pi pi-pencil"
                  class="p-button-rounded p-button-success mr-2"
                  (click)="editIngredient(ingredient)"></button>

                <button pButton pRipple icon="pi pi-trash"
                  class="p-button-rounded p-button-danger"
                  (click)="deleteIngredient(ingredient)"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <!-- DIALOG: Ingredient -->
      <p-dialog [(visible)]="ingredientDialog" [style]="{width:'450px'}" header="Ingredient Details" [modal]="true" styleClass="p-fluid">
        <ng-template pTemplate="content">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" pInputText id="name" [(ngModel)]="ingredient.name" required autofocus />
            <small class="p-error" *ngIf="submitted && !ingredient.name">Name is required.</small>
          </div>

          <div class="field">
            <label for="quantity">Quantity</label>
            <p-inputNumber id="quantity" [(ngModel)]="ingredient.quantity" [min]="0" [useGrouping]="false" inputStyleClass="w-full"></p-inputNumber>
          </div>

          <div class="field">
            <label for="unit">Unit</label>
            <p-dropdown id="unit" [options]="unitOptions" [(ngModel)]="ingredient.unit" placeholder="Select a unit" appendTo="body"></p-dropdown>
            <small class="p-error" *ngIf="submitted && ingredient.unit == null">Unit is required.</small>
          </div>
        </ng-template>

        <ng-template pTemplate="footer">
          <button pButton pRipple label="Cancel" icon="pi pi-times"
            class="p-button-text" (click)="hideDialog()"></button>

          <button pButton pRipple label="Save" icon="pi pi-check"
            class="p-button-text" (click)="saveIngredient()"></button>
        </ng-template>
      </p-dialog>

      <!-- DELETE dialog -->
      <p-dialog [(visible)]="deleteIngredientDialog" header="Confirm" [modal]="true" [style]="{width:'450px'}">
        <div class="flex align-items-center justify-content-center">
          <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
          <span *ngIf="ingredient">Are you sure you want to delete <b>{{ingredient.name}}</b>?</span>
        </div>
        <ng-template pTemplate="footer">
          <button pButton pRipple icon="pi pi-times" class="p-button-text" label="No" (click)="deleteIngredientDialog = false"></button>
          <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Yes" (click)="confirmDelete()"></button>
        </ng-template>
      </p-dialog>

    </div>
  </div>
</div>

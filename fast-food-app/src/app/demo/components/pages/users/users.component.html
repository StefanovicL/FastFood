<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p-toast></p-toast>

      <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
          <div class="my-2">
            <button pButton pRipple label="Novi korisnik" icon="pi pi-plus"
              class="p-button-success mr-2" (click)="openNew()"></button>
          </div>
        </ng-template>
      </p-toolbar>

      <p-table
        #dt
        [value]="users"
        responsiveLayout="scroll"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[10,20,30]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Prikazano {first} do {last} od ukupno {totalRecords} stavki"
        [rowHover]="true"
        dataKey="id"
        [globalFilterFields]="['username']"
      >
        <ng-template pTemplate="caption">
          <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
            <h5 class="m-0">Upravljanje korisnicima</h5>
            <span class="block mt-2 md:mt-0 p-input-icon-left">
              <i class="pi pi-search"></i>
              <input pInputText type="text" (input)="onGlobalFilter(dt, $event)"
                placeholder="Pretraži..." class="w-full sm:w-auto" />
            </span>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="username">
              Korisničko ime <p-sortIcon field="username"></p-sortIcon>
            </th>

            <th>Uloge</th>

            <th></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
          <tr>
            <td style="min-width: 12rem;">
              <span class="p-column-title">Korisničko ime</span>
              {{ user.username }}
            </td>

            <td style="min-width: 10rem;">
              <span class="p-column-title">Uloge</span>
              {{ roleNames(user) }}
            </td>

            <td>
              <div class="flex">
                <button pButton pRipple icon="pi pi-pencil"
                  class="p-button-rounded p-button-success mr-2"
                  (click)="editUser(user)"></button>

                <button pButton pRipple icon="pi pi-trash"
                  class="p-button-rounded p-button-danger"
                  (click)="deleteUser(user)"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <!-- DIALOG: User -->
      <p-dialog [(visible)]="userDialog" [style]="{width:'450px'}" header="Detalji korisnika" [modal]="true" styleClass="p-fluid">
        <ng-template pTemplate="content">
          <div class="field">
            <label for="username">Korisničko ime</label>
            <input type="text" pInputText id="username" [(ngModel)]="user.username" required autofocus />
            <small class="p-error" *ngIf="submitted && !user.username">Korisničko ime je obavezno.</small>
          </div>

          <div class="field">
            <label for="password">Lozinka</label>
            <input type="password" pInputText id="password" [(ngModel)]="user.password"
              [placeholder]="user.id ? 'Ostavite prazno da zadržite trenutnu lozinku' : ''" />
            <small class="p-error" *ngIf="submitted && !user.id && !user.password">Lozinka je obavezna.</small>
          </div>

          <div class="field">
            <label for="role">Uloga</label>
            <p-dropdown id="role" [options]="roleOptions" [(ngModel)]="user.roleId" placeholder="Izaberite ulogu" appendTo="body"></p-dropdown>
            <small class="p-error" *ngIf="submitted && user.roleId == null">Uloga je obavezna.</small>
          </div>
        </ng-template>

        <ng-template pTemplate="footer">
          <button pButton pRipple label="Otkaži" icon="pi pi-times"
            class="p-button-text" (click)="hideDialog()"></button>

          <button pButton pRipple label="Sačuvaj" icon="pi pi-check"
            class="p-button-text" (click)="saveUser()"></button>
        </ng-template>
      </p-dialog>

      <!-- DELETE dialog -->
      <p-dialog [(visible)]="deleteUserDialog" header="Potvrda" [modal]="true" [style]="{width:'450px'}">
        <div class="flex align-items-center justify-content-center">
          <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
          <span *ngIf="user">Da li ste sigurni da želite da obrišete korisnika <b>{{user.username}}</b>?</span>
        </div>
        <ng-template pTemplate="footer">
          <button pButton pRipple icon="pi pi-times" class="p-button-text" label="Ne" (click)="deleteUserDialog = false"></button>
          <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Da" (click)="confirmDelete()"></button>
        </ng-template>
      </p-dialog>

    </div>
  </div>
</div>

<div *ngIf="!showCart" class="grid"><div class="col-12"><p-toast></p-toast><div class="card"><p-dataView #dv [value]="productsToDisplay" [paginator]="true" [rows]="9" filterBy="name" [sortField]="sortField" [sortOrder]="sortOrder" layout="grid"><ng-template pTemplate="header"><div class="flex flex-column md:flex-row md:justify-content-between gap-2"><p-dropdown [options]="sortOptions" placeholder="Sort By Price" (onChange)="onSortChange($event)"></p-dropdown><span class="p-input-icon-left"><i class="pi pi-search"></i><input type="search" pInputText placeholder="Search by Name" (input)="onFilter(dv, $event)"></span></div></ng-template><ng-template let-product pTemplate="gridItem"><div class="col-12 md:col-4"><div class="card m-3 border-1 surface-border"><div class="flex flex-column align-items-center text-center mb-3"><img [src]="getProductImage(product)" [alt]="product.name" class="w-9 shadow-2 my-3 mx-0"><div class="text-2xl font-bold">{{product.name}}</div><div class="mb-3">{{product.description}}</div><p-dropdown [options]="productSizeOptions" [ngModel]="getVariantSize(product)" (onChange)="onSizeChange($event.value, product)"></p-dropdown></div><div class="flex align-items-center justify-content-between"><span class="text-2xl font-semibold">{{getVariantPrice(product)}} RSD</span><p-button icon="pi pi-shopping-cart" [disabled]="hasOutOfStockIngredient(product)" (onClick)="addToCart(product)"></p-button></div></div></div></ng-template></p-dataView></div></div></div><app-cart *ngIf="showCart" [productsInCart]="cart" (backToMenu)="showCart = false"></app-cart><button *ngIf="!showCart" pButton pRipple type="button" icon="pi pi-shopping-cart" class="p-button-rounded fixed-cart-button" (click)="toggleView()"></button>

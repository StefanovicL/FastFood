<div class="layout-topbar" style="border: 1px solid var(--surface-border);">
    <div class="py-4 px-4 mx-0 md:mx-6 lg:mx-8 lg:px-8 flex align-items-center justify-content-between relative lg:static mb-3">
        <a class="flex align-items-center" (click)="router.navigate(['/landing'])">
            <img src="assets/demo/images/logos/logo.svg" alt="BURGERS Logo" height="50" class="mr-0 lg:mr-2">
            <!-- <img src="assets/layout/images/{{layoutService.config.colorScheme === 'light' ? 'logo-dark' : 'logo-white'}}.svg" alt="BURGERS Logo" height="50" class="mr-0 lg:mr-2"><span class="text-900 font-medium text-yellow-700 text-4xl line-height-3 mr-8">BURGERS</span> -->
        </a>
        <a pRipple class="cursor-pointer block lg:hidden text-700" pStyleClass="@next" enterClass="hidden" leaveToClass="hidden">
            <i class="pi pi-bars text-4xl"></i>
        </a>
        <div class="align-items-center surface-0 flex-grow-1 justify-content-between hidden lg:flex absolute lg:static w-full left-0 px-6 lg:px-0 z-2 header text-2xl" style="top:120px; background: none !important;">
            <ul class="list-none p-0 m-0 flex lg:align-items-center select-none flex-column lg:flex-row cursor-pointer">
                <li *ngIf="canAccess('landing')">
                    <a (click)="router.navigate(['/landing'], {fragment: 'home'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3">
                    <span>Početna strana</span>
                    </a>
                </li>
                <li *ngIf="canAccess('uikit/list')">
                    <a (click)="router.navigate(['/uikit/list'], {fragment: 'meni'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3"><span>Meni</span></a>
                </li>
                <li *ngIf="canAccess('pages/crud')">
                    <a (click)="router.navigate(['/pages/crud'], {fragment: 'crud'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3"><span>Proizvodi</span></a>
                </li>
                <!-- <li>
                    <a (click)="router.navigate(['/uikit/media'], {fragment: 'media'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3">
                        <span>Galerija</span>
                    </a>
                </li> -->
                <li *ngIf="canAccess('pages/order')">
                    <a (click)="router.navigate(['/pages/order'], {fragment: 'orders'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3">
                        <span>Porudžbine</span>
                    </a>
                </li>
                <li *ngIf="canAccess('pages/active-orders')">
                    <a (click)="router.navigate(['/pages/active-orders'])" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3">
                        <span>Aktivne porudžbine</span>
                    </a>
                </li>
                <li *ngIf="canAccess('pages/order-status')">
                    <a (click)="router.navigate(['/pages/order-status'])" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3">
                        <span>Status porudžbina</span>
                    </a>
                </li>
                <li *ngIf="canAccess('pages/ingredients')">
                    <a (click)="router.navigate(['/pages/ingredients'])" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3">
                        <span>Zalihe</span>
                    </a>
                </li>
                <li *ngIf="canAccess('pages/users')">
                    <a (click)="router.navigate(['/pages/users'])" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-light line-height-3">
                        <span>Korisnici</span>
                    </a>
                </li>
            </ul>
            <div *ngIf="!isSignedIn" class="flex justify-content-between lg:block border-top-1 lg:border-top-none surface-border py-3 lg:py-0 mt-3 lg:mt-0">
                    <a href="auth/login"><button pButton pRipple label="Prijava" class="p-button-rounded border-none ml-5 font-light line-height-2 bg-yellow-700 text-white text-2xl"></button></a>
            </div>
            <div *ngIf="isSignedIn" class="flex justify-content-between lg:block border-top-1 lg:border-top-none surface-border py-3 lg:py-0 mt-3 lg:mt-0">
                    <button pButton pRipple label="Odjavi se" class="p-button-rounded border-none ml-5 font-light line-height-2 bg-yellow-700 text-white text-2xl" (click)="logout()"></button>
            </div>
        </div>
    </div>
</div>
